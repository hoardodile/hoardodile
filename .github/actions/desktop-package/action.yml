name: "Package the desktop app"
description: >
  The shared build + electron-builder chain used by the desktop quality gate
  and the release job, driven by apps/desktop/scripts/package.mjs (mode dir =
  unpacked app; mode publish = installers + resource pack + draft upload +
  feed verification). The cache env redirects electron-builder's download
  cache into the actions/cache path above (a future electron-builder dropping
  the env var just misses the cache).
inputs:
  mode:
    description: "dir | publish (see scripts/package.mjs)."
    required: true
  platform:
    description: "win | linux | mac (defaults to the runner's host platform)."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Build
      shell: bash
      run: pnpm build
    - name: Cache electron-builder downloads
      uses: actions/cache@v6
      with:
        path: .cache/electron-builder
        key: eb-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: eb-${{ runner.os }}-
    - name: Package
      shell: bash
      run: >-
        pnpm -F @hoardodile/desktop package
        --mode ${{ inputs.mode }}
        ${{ inputs.platform != '' && format('--platform {0}', inputs.platform) || '' }}
      env:
        ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
