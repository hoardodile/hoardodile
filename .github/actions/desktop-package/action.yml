name: "Package the desktop app"
description: >
  The shared build + electron-builder chain used by the desktop quality gate
  (package:dir, unpacked) and the release job (package:publish*, installers
  + feed + resource pack). The cache env redirects electron-builder's
  download cache into the actions/cache path above (a future electron-builder
  dropping the env var just misses the cache).
inputs:
  script:
    description: >
      The @hoardodile/desktop script to run: package:dir (unpacked, no
      publish) or package:publish / package:publish:linux / package:publish:mac.
    required: true
runs:
  using: "composite"
  steps:
    - name: Build
      shell: bash
      run: pnpm build
    - name: Cache electron-builder downloads
      uses: actions/cache@v6
      with:
        path: .cache/electron-builder
        key: eb-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: eb-${{ runner.os }}-
    - name: Package
      shell: bash
      run: pnpm -F @hoardodile/desktop ${{ inputs.script }}
      env:
        ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
