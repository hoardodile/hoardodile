name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

# A superseded push cancels the stale run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Repo-level gates that do not depend on the OS: workflow linting, the
  # static guards, the shared build and every publish-closure check. Runs
  # once per push — the OS matrix below only builds, lints and tests.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Lint the workflow YAML/expressions before anything else installs —
      # a broken workflow only surfaces after a push otherwise.
      - name: Lint workflow files
        uses: raven-actions/actionlint@v2
      - uses: ./.github/actions/setup-pnpm
      # BlockNote + the diff-machinery pins must never drift silently.
      - name: Guard protected dependencies
        run: node scripts/guard-protected-deps.mjs
      # Tests must not hardcode Windows path literals — expectations are
      # built from join()/resolve()/sep (or exempted with path-guard-exempt).
      - name: Guard portable test paths
        run: node scripts/guard-portable-tests.mjs
      - name: Build
        run: pnpm build
      # The web build rewrites the committed license artifacts; the
      # regenerated files must equal the committed ones. (routeTree.gen.ts
      # is generated fresh before every web consumer and never committed.)
      - name: Check generated files in sync
        run: node scripts/check-generated-files.mjs
      # Published SDK d.ts must not reference node (browser-facing entries).
      - name: Guard node pollution in SDK d.ts
        run: node scripts/guard-node-pollution.mjs
      # The create-plugin scaffold embeds a copy of plugins/template.
      - name: Check embedded template drift
        run: pnpm -F @hoardodile/create-plugin template:check
      # Validate the publish closure and produce the release tarballs.
      - name: Pack SDK tarballs
        run: pnpm sdks:pack
      # The scaffolder's dependency list must match the release set.
      - name: Check scaffolder dependency list
        run: node scripts/gen-sdk-deps.mjs --check
      - name: Check third-party notices
        run: pnpm licenses:check
      - name: Check version sync
        run: pnpm version:check

  # Biome + tsc across the workspace — OS-independent, one leg is enough.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Lint
        run: pnpm lint

  # The OS matrix: build once per platform and run the full test suite.
  test:
    strategy:
      # One failing platform leg must not cancel the rest — each runner
      # finishes and reports its own result (same as the desktop/release
      # matrices); the workflow only fails once every leg has spoken.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    # Bound a wedged job instead of letting it stall until the runner dies.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm build
      - name: Test
        id: test
        # Windows runners intermittently crash vitest child processes with
        # 0xC0000142 — re-run once via the follow-up step below; a real
        # failure fails again there instead of being masked.
        continue-on-error: true
        # --continue: one failing package must not stop the remaining
        # packages' tests from running and reporting.
        run: pnpm exec turbo run test --concurrency=2 --continue
      - name: Test (retry)
        if: steps.test.outcome == 'failure'
        run: pnpm exec turbo run test --concurrency=2 --continue

  # Acceptance gate for every release: the published SDK closure must
  # install, build, test and run outside this workspace (scaffold +
  # standalone tsc/build/test/detect + dev loop). Own job: it re-packs the
  # tarballs and runs a full standalone install, slower than the matrix.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm build
      - name: Smoke test published SDK closure
        run: pnpm smoke:published

  # Smoke suite only — keep it fast enough to run on every push/PR.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-
      - name: Install Playwright browser
        run: pnpm -F @hoardodile/web exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm -F @hoardodile/web test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
