name: Release

# Publish flow after `pnpm release <version>` (local): release-it bumps
# versions, commits, tags and creates a DRAFT GitHub Release; pushing the
# tag triggers this workflow, which publishes the SDK release set to npm
# and builds/attaches the installers to the same draft. A human then
# reviews the draft on GitHub and clicks Publish — electron-updater only
# sees published releases, so the draft is the review gate.
#
# The `release-draft` job owns the draft via scripts/ensure-release-draft.mjs
# (creates it, fills an empty body, normalizes the title — idempotent), so a
# web-fallback release-it or a manual rerun never leaves the release without
# notes. `workflow_dispatch` (input `version`) re-runs the same pipeline
# against a fixed branch without touching the tag — used to complete a
# release whose tag predates a pipeline fix.
#
# Full operational docs (local flow, npm Trusted Publishing one-time setup,
# dispatch usage): CONTRIBUTING.md → "Releasing". The npm job publishes via
# OIDC (no registry token in Actions); the desktop matrix is driven by
# scripts/lib/resource-pack-targets.mjs (`PACK_UPLOAD`) and the shared
# ./.github/actions/desktop-package action.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match package.json and the v<version> tag), e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # Owns the draft release, ahead of every upload: electron-builder would
  # otherwise auto-create an empty one (name = version, no body) when a
  # local release-it fell back to web mode or when a legacy tag is
  # re-released. Idempotent — only creates or fills when needed.
  release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/ensure-release-draft.mjs
          ${{ github.event_name == 'workflow_dispatch' && format('--version {0}', inputs.version) || '' }}

  # Publishes the SDK release set to npm. Trusted publishing (OIDC): the
  # id-token replaces registry credentials; provenance is requested explicitly.
  npm:
    needs: release-draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      # Dispatch runs validate the version + tag in ensure-release-draft.mjs
      # (a branch checkout has no local tag to check).
      - name: Verify tag matches the unified version
        if: github.event_name == 'push'
        run: node scripts/check-tag-version.mjs
      - name: Build
        run: pnpm build
      # Same guard as CI: a build that regenerates a committed artifact
      # differently would dirty the tree and make the publish git checks
      # fail — fail fast, before publishing.
      - name: Check generated files in sync
        run: node scripts/check-generated-files.mjs
      - name: Verify SDK closure packs
        run: pnpm sdks:pack
      - name: Check third-party notices
        run: pnpm licenses:check
      - name: Check version sync
        run: pnpm version:check
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Publish SDK release set
        # Idempotent: skips versions already on the registry, so a manual
        # re-run of an already-released version only re-attaches artifacts
        # instead of failing on "version already exists".
        run: node scripts/publish-release-set.mjs

  # One job per release platform, all attaching to the same draft Release.
  # Commits on a macos-14 (arm64) runner produce the mac-arm64 artifacts;
  # macOS x64 is a future matrix entry (needs cross-arch optional-dep
  # staging, see apps/desktop/README.md).
  desktop:
    needs: release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:publish
          - os: ubuntu-latest
            script: package:publish:linux
          - os: macos-14
            script: package:publish:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Verify tag matches the unified version
        if: github.event_name == 'push'
        run: node scripts/check-tag-version.mjs
      - name: Build and publish the installers
        # The chain runs stage-resources → electron-builder(always) →
        # verify-package (natives + sandbox probe + asar guard) →
        # verify-feed; publish fails if either check fails. Per-platform
        # scripts pick the right --target/--platform arguments.
        uses: ./.github/actions/desktop-package
        with:
          script: ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
