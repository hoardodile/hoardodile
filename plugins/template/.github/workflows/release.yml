name: release

# Normally the tag is produced by `pnpm release <version>` (release-it bumps
# package.json + manifest.json, writes CHANGELOG.md, commits, tags and pushes).
# This workflow is the publisher: on tag push it builds, packages
# (`release/<id>-<version>.zip` + `.sha256`) and creates a *published* GitHub
# release the marketplace picks up — so no local GITHUB_TOKEN or `gh` CLI is
# needed. Pushing the tag manually (`git tag v<version> && git push origin
# v<version>`) still works as a fallback.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build the plugin
        run: pnpm build

      - name: Check the tag matches the manifest version
        run: |
          node -e "const m = require('./manifest.json'); const tag = process.env.GITHUB_REF_NAME; const expected = 'v' + m.version; if (tag !== expected) { console.error('tag ' + tag + ' does not match manifest version ' + expected); process.exit(1) }"

      - name: Package the release artifacts
        run: pnpm exec hoardodile plugin package --skip-build

      - name: Gate the readme (readme/ must be flat, images by bare filename)
        run: pnpm readme:check

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(ls release/*)
          if [ -d readme ]; then
            files="$files readme/*"
          fi
          node scripts/release-notes.mjs > /tmp/hd-release-notes.md
          gh release create "$GITHUB_REF_NAME" $files --notes-file /tmp/hd-release-notes.md
