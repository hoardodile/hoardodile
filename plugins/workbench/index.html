<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>hoardodile plugin workbench</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				background: #111;
				color: #ddd;
			}
			#bar {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 8px 12px;
				border-bottom: 1px solid #333;
				font-size: 13px;
			}
			#bar code {
				color: #7dd3fc;
			}
			#bar #hook-status {
				color: #a3a3a3;
				font-size: 12px;
			}
			#bar select {
				background: #1a1a1a;
				color: #ddd;
				border: 1px solid #444;
				border-radius: 6px;
				padding: 3px 8px;
				font-size: 12px;
				max-width: 320px;
			}
			#bar #resource-cover {
				width: 28px;
				height: 28px;
				object-fit: cover;
				border-radius: 4px;
				border: 1px solid #444;
				background: #1a1a1a;
				flex: none;
			}
			#bar #resource-cover[hidden] {
				display: none;
			}
			#bar button {
				margin-left: auto;
				background: #222;
				color: #ddd;
				border: 1px solid #444;
				border-radius: 6px;
				padding: 4px 12px;
				cursor: pointer;
			}
			#bar button:hover {
				background: #333;
			}
			#stage {
				display: flex;
				justify-content: center;
				padding: 16px;
			}
			iframe {
				border: 1px solid #333;
				border-radius: 8px;
				background: #000;
				width: min(1200px, 100%);
				height: 80vh;
			}
		</style>
	</head>
	<body>
		<div id="bar">
			<span>plugin</span>
			<code id="plugin-name">…</code>
			<label for="resource-picker">resource</label>
			<img
				id="resource-cover"
				alt=""
				referrerpolicy="no-referrer"
				hidden
			/>
			<select id="resource-picker"></select>
			<span id="hook-status">…</span>
			<button id="reload" type="button">reload</button>
		</div>
		<div id="stage"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
