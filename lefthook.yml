commit-msg:
  jobs:
    - name: verify-commit
      run: node scripts/verify-commit.mjs {1}

pre-commit:
  parallel: true
  jobs:
    - name: lint-staged
      run: pnpm lint-staged
    - name: lint
      run: pnpm lint
    - name: version:check
      run: pnpm version:check
    - name: versioned-write-guard
      run: node scripts/guard-versions.mjs --staged
    - name: external-link-guard
      run: node scripts/guard-external-links.mjs --staged
    - name: protected-deps-guard
      run: node scripts/guard-protected-deps.mjs
