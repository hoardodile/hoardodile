packages:
  - apps/*
  - packages/*
  - plugins/*
allowBuilds:
  "@hoardodile/7z-bin": true
  "@hoardodile/ffmpeg-bin": true
  "@hoardodile/ffprobe-bin": true
  "@hoardodile/restic-bin": true
  "@hoardodile/rclone-bin": true
  # 13.x bundles per-platform prebuilds loaded at runtime; its implicit
  # node-gyp build (binding.gyp) is unnecessary and needs a Python toolchain.
  better-sqlite3: false
  electron: true
  electron-winstaller: false
  esbuild: true
  lefthook: true
catalog:
  "@biomejs/biome": 2.6.2
  "@playwright/test": ^1.64.1
  # Electron e2e driving (`_electron`); keep in lockstep with
  # @playwright/test above.
  playwright: 1.64.1
  "@release-it/conventional-changelog": ^12.0.2
  "@rolldown/plugin-babel": ^0.2.4
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/semver": ^7.8.0
  "@vitejs/plugin-react": ^6.1.2
  babel-plugin-react-compiler: ^1.0.0
  es-toolkit: ^1.52.0
  http-proxy-agent: ^9.1.0
  https-proxy-agent: ^9.1.0
  i18next: ^26.5.6
  jsdom: ^30.1.3
  lefthook: ^2.2.2
  lint-staged: ^17.6.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.4
  react-use: ^17.6.1
  "@solar-icons/react": ^2.3.3
  release-it: ^21.1.1
  sharp: ^0.35.5
  semver: ^7.8.5
  tailwindcss: ^4.3.3
  tar: ^7.5.22
  tsup: ^9.0.0
  typescript: ^7.0.2
  vite: ^8.3.5
  vite-node: ^6.0.0
  vitest: ^5.0.5
  zod: ^4.6.7
  zustand: ^5.0.16
audit:
  level: high
