packages:
  - apps/*
  - packages/*
  - plugins/*
allowBuilds:
  '@hoardodile/7z-bin': true
  '@hoardodile/ffmpeg-bin': true
  '@hoardodile/ffprobe-bin': true
  '@hoardodile/restic-bin': true
  '@hoardodile/rclone-bin': true
  # 13.x bundles per-platform prebuilds loaded at runtime; its implicit
  # node-gyp build (binding.gyp) is unnecessary and needs a Python toolchain.
  better-sqlite3: false
  electron: true
  electron-winstaller: false
  esbuild: true
  lefthook: true
catalog:
  '@biomejs/biome': 2.5.10
  '@playwright/test': ^1.62.1
  # Electron e2e driving (`_electron`); keep in lockstep with
  # @playwright/test above.
  playwright: 1.62.1
  '@release-it/conventional-changelog': ^12.0.0
  '@rolldown/plugin-babel': ^0.2.3
  '@tailwindcss/vite': ^4.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.2
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/semver': ^7.8.0
  '@vitejs/plugin-react': ^6.1.0
  babel-plugin-react-compiler: ^1.0.0
  es-toolkit: ^1.51.0
  http-proxy-agent: ^7.0.2
  https-proxy-agent: ^7.0.6
  i18next: ^26.4.0
  jsdom: ^30.0.1
  lefthook: ^2.1.10
  lint-staged: ^17.3.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-i18next: ^17.0.12
  react-use: ^17.6.1
  '@solar-icons/react': ^2.1.0
  release-it: ^21.0.2
  sharp: ^0.35.3
  semver: ^7.8.5
  tailwindcss: ^4.3.3
  tar: ^7.4.3
  tsup: ^8.5.1
  typescript: ^7.0.2
  vite: ^8.2.2
  vite-node: ^6.0.0
  vitest: ^4.1.11
  zod: ^4.4.3
  zustand: ^5.0.15
# New @hoardodile/*-bin releases are excluded from minimumReleaseAge so
# the workspace can consume them immediately. Bump flow: temporarily list
# BOTH the old and the new version here, run `pnpm install` (only the one
# dependency edge re-resolves; the old version drops out of the lockfile),
# then remove the old version from this list. Never run `pnpm clean
# --lockfile` for this: it re-resolves the whole tree and drags in
# unrelated dependency upgrades that would pollute the commit.
minimumReleaseAgeExclude:
  - '@hoardodile/7z-bin@1.1.3'
  - '@hoardodile/ffmpeg-bin@1.0.0'
  - '@hoardodile/ffprobe-bin@1.0.0'
  - '@hoardodile/restic-bin@1.0.0'
  - '@hoardodile/rclone-bin@1.0.0'
  - fast-uri@3.1.7 || 4.1.4
# fast-uri carries high-severity advisories (host confusion / SSRF via IDN,
# IPv6 and percent-decoding normalization): GHSA-5jgf-p345-68v8,
# GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp. The parent
# ranges (ajv ^3, @fastify/ajv-compiler & fast-json-stringify ^4) already
# allow the patched releases, but pnpm keeps an existing transitive
# resolution, so pin each line to the first fixed version — otherwise the
# release workflow's `pnpm audit --prod --audit-level high` gate fails.
overrides:
  fast-uri@^3: 3.1.7
  fast-uri@^4: 4.1.4
